# helpcenter.aeven.io — the help center
#
#   /   ->  /datadrive/apps/helpcenter/build     a Docusaurus build, served off disk
#
# There is no application process behind this name. A release is: pull the
# Aeven-AI/Helpcenter checkout in /datadrive/apps/helpcenter, build, done —
# nginx reads the new files on the next request.

# The visitor's language for an address that names none: zh-* reads Chinese, es-* Spanish,
# everything else English. Shared by the help center and aeven.io's old help addresses.
map $http_accept_language $helpcenter_language {
    default en;
    ~*^zh   cn;
    ~*^es   es;
}

# help.aeven.io is an old name of the help center: every address moves to the same path on
# helpcenter.aeven.io, and a /docs address straight to the visitor's language. Without this
# server the name falls through to the first 443 server, which sends it to the aeven.io landing.
server {
    server_name help.aeven.io;
    listen 10.0.0.142:80;
    listen 10.0.0.142:443 ssl http2;

    ssl_certificate         /etc/ssl/virtualmin/179268677992436/ssl.cert;
    ssl_certificate_key     /etc/ssl/virtualmin/179268677992436/ssl.key;

    location ^~ /.well-known/ {
        root /datadrive/apps/helpcenter/build;
        try_files $uri =404;
    }

    location ^~ /docs {
        return 301 https://helpcenter.aeven.io/$helpcenter_language$request_uri;
    }

    location / {
        return 301 https://helpcenter.aeven.io$request_uri;
    }
}

server {
    server_name helpcenter.aeven.io;
    listen 10.0.0.142:80;

    location ^~ /.well-known/ {
        root /datadrive/apps/helpcenter/build;
        try_files $uri =404;
    }

    location / {
        return 301 https://helpcenter.aeven.io$request_uri;
    }
}

server {
    server_name helpcenter.aeven.io;
    listen 10.0.0.142:443 ssl http2;

    root /datadrive/apps/helpcenter/build;
    index index.html;

    access_log /var/log/virtualmin/helpcenter.aeven.io_access_log;
    error_log  /var/log/virtualmin/helpcenter.aeven.io_error_log;

    ssl_certificate         /etc/ssl/virtualmin/179268677992436/ssl.cert;
    ssl_certificate_key     /etc/ssl/virtualmin/179268677992436/ssl.key;
    ssl_trusted_certificate /etc/ssl/virtualmin/179268677992436/ssl.ca;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:aeven_ssl:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    error_page 404 /404.html;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    # Addresses from before every language had its own segment (/docs/... rather than
    # /en/docs/...) move permanently to the visitor's language.
    location = /docs {
        return 301 /$helpcenter_language/docs/;
    }

    location ^~ /docs/ {
        return 301 /$helpcenter_language$request_uri;
    }

    # Docusaurus writes a directory per page and a hashed file per asset.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Hashed bundles never change under the same name.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(?:woff2?|ttf|otf|svg|png|jpe?g|webp|gif|ico|mp4|webm)$ {
        expires 30d;
        access_log off;
    }
}

# helpcenter.aeven.io — the help center
#
#   /   ->  /datadrive/apps/helpcenter/build     a Docusaurus build, served off disk
#
# There is no application process behind this name. A release is: pull the
# Aeven-AI/Helpcenter checkout in /datadrive/apps/helpcenter, build, done —
# nginx reads the new files on the next request.

server {
    server_name helpcenter.aeven.io;
    listen 10.0.0.142:80;

    location ^~ /.well-known/ {
        root /datadrive/apps/helpcenter/build;
        try_files $uri =404;
    }

    location / {
        return 301 https://helpcenter.aeven.io$request_uri;
    }
}

server {
    server_name helpcenter.aeven.io;
    listen 10.0.0.142:443 ssl http2;

    root /datadrive/apps/helpcenter/build;
    index index.html;

    access_log /var/log/virtualmin/helpcenter.aeven.io_access_log;
    error_log  /var/log/virtualmin/helpcenter.aeven.io_error_log;

    ssl_certificate         /etc/ssl/virtualmin/179268677992436/ssl.cert;
    ssl_certificate_key     /etc/ssl/virtualmin/179268677992436/ssl.key;
    ssl_trusted_certificate /etc/ssl/virtualmin/179268677992436/ssl.ca;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:aeven_ssl:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    error_page 404 /404.html;

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml;

    # Docusaurus writes a directory per page and a hashed file per asset.
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    # Hashed bundles never change under the same name.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(?:woff2?|ttf|otf|svg|png|jpe?g|webp|gif|ico|mp4|webm)$ {
        expires 30d;
        access_log off;
    }
}
